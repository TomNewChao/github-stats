name: Generate Stats Images

on:
  push:
    branches:
      - master
  pull_request:
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash -euxo pipefail {0}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Unit tests for the personal-contribution collector
      run: python3 -m unittest discover -s tests -v

    - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29  # v2 tag
      with:
        version: 0.16.0

    # Synthetic data only: no token, no network, nothing private.
    - name: Render both cards from a fixture
      run: |
        zig build
        ./zig-out/bin/github-stats --json-input-file tests/fixture_stats.json \
          --overview-output-file /tmp/overview.svg \
          --languages-output-file /tmp/languages.svg
        grep -q 'Lines of code changed (12 months)' /tmp/overview.svg
        grep -q '10,000' /tmp/overview.svg
        grep -q 'Languages (My Code, Past 12 Months)' /tmp/languages.svg
        grep -q '<span class="lang">Python</span>' /tmp/languages.svg
        grep -q '60.00%' /tmp/languages.svg
        if grep -q '<span class="lang">Go</span>' /tmp/languages.svg; then
          echo "fixture has no Go, but the card shows it" >&2
          exit 1
        fi

  build:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v6

    - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29  # v2 tag
      with:
        version: 0.16.0

    - name: Build
      run: zig build

    - name: Checkout history branch
      run: |
        git config --global user.name "jstrieb/github-stats"
        git config --global user.email "github-stats[bot]@jstrieb.github.io"
        git pull
        git checkout generated || git checkout -b generated

    # Pass 1: jstrieb's native discovery via the contribution graph (green squares).
    # This MISSES repos whose commits were merged via PR squash-merge
    # (committer = GitHub), e.g. openIndu/openindu-station. The merge step
    # below tops those up from repositoriesContributedTo.
    - name: Pass 1 - jstrieb collect via contribution graph
      run: |
        ./zig-out/bin/github-stats --json-output-file stats.json
      env:
        ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        EXCLUDE_PRIVATE: "false"
        SILENT: "true"
        MAX_RETRIES: 5

    # Merge: top up repos the contribution graph skipped (openindu-station, etc.).
    # merge_repos.py lives on master; read it from there at runtime.
    - name: Merge repos missed by the contribution graph
      run: |
        git show master:merge_repos.py > /tmp/merge_repos.py
        python3 /tmp/merge_repos.py
      env:
        GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        OWNER: TomNewChao
        STATS_FILE: stats.json

    # Own forks (full names) are left out: their default branch mirrors the
    # upstream, where the same commits are counted once.
    - name: Build own-fork exclusion list
      shell: bash -euo pipefail {0}  # no xtrace: keep repository names out of the public log
      run: |
        FORKS=$(gh api "users/TomNewChao/repos?per_page=100&type=owner" --paginate \
          --jq '.[] | select(.fork==true) | .full_name' 2>/dev/null | paste -sd, - || true)
        echo "EXCLUDE_FORKS=$FORKS" >> "$GITHUB_ENV"
      env:
        GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}

    # Replace every repository's whole-repo language sizes and all-time line count
    # with this user's own code changes over the last 365 days. Upstream projects
    # (more than 1000 stars) keep their place but lose their stars/forks/views.
    # recent_stats.py lives on master, like merge_repos.py. It never prints
    # private repository names: this repository, and its logs, are public.
    - name: Collect recent personal code changes
      run: |
        git show master:recent_stats.py > /tmp/recent_stats.py
        python3 /tmp/recent_stats.py --input stats.json --output recent-stats.json --days 365
      env:
        GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        EXCLUDE_REPOS: ${{ env.EXCLUDE_FORKS }}

    # Pass 2: regenerate SVGs from that data (zero new API calls).
    - name: Pass 2 - regenerate images from recent personal changes
      run: |
        ./zig-out/bin/github-stats --json-input-file recent-stats.json
      env:
        ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        EXCLUDE_REPOS: ${{ env.EXCLUDE_FORKS }}
        EXCLUDE_LANGS: ${{ secrets.EXCLUDE_LANGS }}
        EXCLUDE_PRIVATE: "false"
        SILENT: "true"
        MAX_RETRIES: 5

    # No artifact upload on purpose: stats.json lists private repository names,
    # and artifacts of a public repository can be downloaded by any GitHub user.
    - name: Commit to the repo
      run: |
        rm -f stats.json recent-stats.json
        git add overview.svg languages.svg
        git commit -m 'Update generated files' || true
        git push --set-upstream origin generated
